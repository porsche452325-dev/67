<style>
/* Layout: classic link-in-bio stack (avatar, name, bio, socials, equal buttons) over the camo-spotlight background; dark-only brand look */
:root {
  color-scheme: dark;
  --ink: #0d0e0b;
  --cream: #ede6d6;
  --cream-dim: #c9c2b1;
  --camo: #b2c478;
  --btn: rgba(237, 230, 214, .94);
  --btn-hover: #f7f1e4;
  --font: "Archivo", "Helvetica Neue", Arial, sans-serif;
}
html { background: var(--ink); }
body {
  background: var(--ink);
  color: var(--cream);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.4;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 44px 36px;
  min-height: 100%;
}
.bg {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(70% 40% at 50% 0%, rgba(237,230,214,.07), rgba(237,230,214,0) 70%),
    radial-gradient(80% 45% at 50% 100%, rgba(178,196,120,.22), rgba(178,196,120,0) 70%),
    var(--ink);
}
.bg::after {
  content: ""; position: absolute; inset: 0;
  background: url("img/camo.jpg") center bottom / cover no-repeat;
  opacity: .45;
  -webkit-mask-image: linear-gradient(to bottom, transparent 35%, #000 100%);
          mask-image: linear-gradient(to bottom, transparent 35%, #000 100%);
}
.wrap { position: relative; z-index: 1; max-width: 580px; margin: 0 auto; display: grid; gap: 22px; }

/* profile */
.profile { display: grid; justify-items: center; gap: 10px; text-align: center; }
.avatar { width: 96px; height: 96px; border-radius: 50%; display: block; box-shadow: 0 0 0 3px rgba(237,230,214,.18); }
.handle { margin: 6px 0 0; font-size: 20px; font-weight: 800; letter-spacing: .005em; }
.bio { margin: 0; font-size: 15px; font-weight: 500; color: var(--cream-dim); text-wrap: balance; }

/* social icons row */
.socials { display: flex; justify-content: center; gap: 18px; margin-top: 2px; }
.social {
  width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%;
  color: var(--cream); text-decoration: none; transition: transform .15s ease, color .15s ease;
}
.social svg { width: 26px; height: 26px; }
.social:hover { transform: scale(1.08); color: var(--camo); }

/* buttons */
.links { display: grid; gap: 14px; }
.btn {
  position: relative; display: flex; align-items: center; justify-content: center;
  min-height: 62px; padding: 8px 64px; border-radius: 999px;
  background: var(--btn); color: var(--ink); text-decoration: none; text-align: center;
  font-weight: 700; font-size: 16px; font-variation-settings: "wdth" 108;
  box-shadow: 0 6px 18px rgba(0,0,0,.28);
  transition: transform .15s ease, background-color .15s ease;
}
.btn:hover { transform: scale(1.02); background: var(--btn-hover); }
.btn .ico {
  position: absolute; left: 8px; top: 50%; translate: 0 -50%;
  width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center;
  background: var(--ink); color: var(--cream);
}
.btn .ico svg { width: 22px; height: 22px; }
.btn.accent { background: var(--camo); }
.btn.accent:hover { background: #c3d48a; }
.btn.soon { background: rgba(237,230,214,.12); color: var(--cream); box-shadow: none; cursor: default; border: 1px dashed rgba(237,230,214,.35); }
.btn.soon:hover { transform: none; }
.btn.soon .ico { background: rgba(237,230,214,.12); }
.tag { display: block; font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; opacity: .7; margin-top: 2px; }

/* featured link with image */
.feature {
  display: grid; grid-template-columns: 1fr; overflow: hidden; border-radius: 26px;
  background: var(--btn); color: var(--ink); text-decoration: none; box-shadow: 0 6px 18px rgba(0,0,0,.28);
  transition: transform .15s ease;
}
.feature:hover { transform: scale(1.015); }
.feature-img {
  aspect-ratio: 16 / 10; max-width: 100%; display: grid; place-items: center;
  background: radial-gradient(60% 70% at 50% 60%, rgba(178,196,120,.55), rgba(178,196,120,0) 70%), #1b1d14;
}
.feature-img img { height: 92%; width: auto; max-width: 100%; transform: rotate(-4deg); filter: drop-shadow(0 18px 18px rgba(0,0,0,.55)); }
.feature-text { padding: 14px 20px 16px; text-align: center; font-weight: 700; font-size: 16px; font-variation-settings: "wdth" 108; }

.btn:focus-visible, .feature:focus-visible, .social:focus-visible { outline: 2px solid var(--cream); outline-offset: 3px; }

.foot { display: grid; justify-items: center; gap: 6px; margin-top: 18px; text-align: center; }
.foot img { width: 120px; height: auto; opacity: .9; }
.foot span { font-size: 12px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--cream-dim); }

@media (prefers-reduced-motion: reduce) { .btn, .feature, .social { transition: none; } .btn:hover, .feature:hover, .social:hover { transform: none; } }
</style>
