<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shirt Pre-Order</title>
<style>
  :root {
    --bg: #0e0e10; --card: #1a1a1d; --text: #f4f4f5; --muted: #a1a1aa;
    --accent: #ffd60a; --accent-text: #111; --bubble-me: #ffd60a; --bubble-bot: #27272a;
    --border: #2e2e33;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 16px; }
  .brand { font-size: 13px; letter-spacing: .15em; text-transform: uppercase; color: var(--muted); }
  h1 { margin: 4px 0 4px; font-size: 32px; line-height: 1.1; }
  .tagline { color: var(--muted); margin: 0 0 14px; }
  .gallery { display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x mandatory; border-radius: 14px; }
  .gallery img, .gallery .ph { flex: 0 0 100%; aspect-ratio: 1; object-fit: cover; scroll-snap-align: start;
         border-radius: 14px; background: var(--card); }
  .ph { display: grid; place-items: center; color: var(--muted); font-size: 14px; border: 1px dashed var(--border); }
  .row { display: flex; justify-content: space-between; align-items: baseline; margin: 16px 0 8px; }
  .price { font-size: 28px; font-weight: 800; }
  .countdown { font-size: 14px; color: var(--accent); font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
  .chip { border: 1px solid var(--border); border-radius: 999px; padding: 4px 12px; font-size: 14px; }
  .info { color: var(--muted); font-size: 14px; margin: 10px 0 0; }
  .info b { color: var(--text); font-weight: 600; }

  .chat { margin-top: 22px; background: var(--card); border: 1px solid var(--border); border-radius: 18px; overflow: hidden; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; }
  .tab { appearance: none; border: 0; background: transparent; color: var(--muted); padding: 14px 8px;
         font: inherit; font-weight: 700; cursor: pointer; border-bottom: 2px solid var(--border); }
  .tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
  .tab small { display: block; font-weight: 400; font-size: 12px; }
  .log { height: 360px; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 85%; padding: 9px 13px; border-radius: 16px; white-space: pre-wrap; word-wrap: break-word; }
  .bot { background: var(--bubble-bot); align-self: flex-start; border-bottom-left-radius: 4px; }
  .me { background: var(--bubble-me); color: var(--accent-text); align-self: flex-end; border-bottom-right-radius: 4px; }
  .typing { color: var(--muted); font-style: italic; }
  .order-ok { border: 1px solid var(--accent); }
  form { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--border); }
  input { flex: 1; min-width: 0; background: var(--bg); color: var(--text); border: 1px solid var(--border);
          border-radius: 999px; padding: 11px 15px; font: inherit; }
  button.send { background: var(--accent); color: var(--accent-text); border: 0; border-radius: 999px;
          padding: 0 18px; font: inherit; font-weight: 700; cursor: pointer; }
  button.send:disabled { opacity: .5; }
  .quick { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 14px 10px; }
  .quick button { background: transparent; color: var(--text); border: 1px solid var(--border); border-radius: 999px;
          padding: 5px 11px; font: inherit; font-size: 13px; cursor: pointer; }
  footer { text-align: center; color: var(--muted); font-size: 13px; margin: 22px 0 8px; }
  footer a { color: var(--text); margin: 0 6px; }
</style>
</head>
<body>
<main>
  <div class="brand" id="brand"></div>
  <h1 id="name">Loading…</h1>
  <p class="tagline" id="tagline"></p>
  <div class="gallery" id="gallery"></div>

  <div class="row">
    <span class="price" id="price"></span>
    <span class="countdown" id="countdown"></span>
  </div>
  <div class="chips" id="sizes"></div>
  <div class="chips" id="colors"></div>
  <p class="info" id="info"></p>

  <section class="chat" aria-label="Chat">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-helper" aria-selected="true" data-bot="helper">💬 Questions<small>Shirt Helper</small></button>
      <button class="tab" role="tab" id="tab-order" aria-selected="false" data-bot="order">🛒 Order now<small>Order Taker</small></button>
    </div>
    <div class="log" id="log-helper" role="log" aria-live="polite"></div>
    <div class="log" id="log-order" role="log" aria-live="polite" hidden></div>
    <div class="quick" id="quick"></div>
    <form id="form">
      <input id="input" autocomplete="off" placeholder="Type a message…" maxlength="1000" aria-label="Message">
      <button class="send" id="send">Send</button>
    </form>
  </section>

  <footer id="footer"></footer>
</main>
<script>
const $ = (id) => document.getElementById(id);
let sessionId;
try { sessionId = localStorage.getItem("preorder_sid"); } catch (e) {}
if (!sessionId) {
  sessionId = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2));
  try { localStorage.setItem("preorder_sid", sessionId); } catch (e) {}
}
let bot = "helper";
let busy = false;
const greeted = { helper: false, order: false };

const greetings = {
  helper: "Hey! 👋 I'm the Shirt Helper. Ask me anything about sizes, price, shipping, or when it drops.",
  order: "Yo! 🛒 I'm the Order Taker. Let's lock in your shirt. What's your name?",
};
const quickReplies = {
  helper: ["What sizes?", "How does it fit?", "When does it ship?", "I want one!"],
  order: ["Size M", "Size L", "Pickup", "Ship it to me"],
};

function addMsg(who, text, extraClass) {
  const log = $("log-" + bot);
  const div = document.createElement("div");
  div.className = "msg " + who + (extraClass ? " " + extraClass : "");
  div.textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return div;
}

function showQuick() {
  const q = $("quick");
  q.innerHTML = "";
  quickReplies[bot].forEach((t) => {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = t;
    b.onclick = () => send(t);
    q.appendChild(b);
  });
}

function switchTo(name) {
  bot = name;
  ["helper", "order"].forEach((b) => {
    $("tab-" + b).setAttribute("aria-selected", String(b === name));
    $("log-" + b).hidden = b !== name;
  });
  if (!greeted[name]) { addMsg("bot", greetings[name]); greeted[name] = true; }
  showQuick();
  $("input").focus({ preventScroll: true });
}

async function send(text) {
  text = text.trim();
  if (!text || busy) return;
  busy = true; $("send").disabled = true;
  const sentTo = bot;
  addMsg("me", text);
  const typing = addMsg("bot", "typing…", "typing");
  try {
    const res = await fetch("/api/chat", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: sessionId, bot: sentTo, message: text }),
    });
    const data = await res.json().catch(() => ({ reply: "Something went wrong, try again." }));
    typing.remove();
    addMsg("bot", data.reply, data.order_id ? "order-ok" : "");
    if (data.handoff && sentTo === "helper") {
      setTimeout(() => { switchTo("order"); }, 900);
    }
  } catch (e) {
    typing.remove();
    addMsg("bot", "Couldn't connect. Check your internet and try again.");
  } finally {
    busy = false; $("send").disabled = false;
  }
}

$("form").addEventListener("submit", (e) => {
  e.preventDefault();
  const v = $("input").value; $("input").value = "";
  send(v);
});
document.querySelectorAll(".tab").forEach((t) => t.addEventListener("click", () => switchTo(t.dataset.bot)));

function chips(el, items) {
  el.innerHTML = "";
  items.forEach((s) => { const c = document.createElement("span"); c.className = "chip"; c.textContent = s; el.appendChild(c); });
}

function startCountdown(deadline) {
  if (!deadline) return;
  const end = new Date(deadline + "T23:59:59");
  const tick = () => {
    const ms = end - new Date();
    if (ms <= 0) { $("countdown").textContent = "Pre-order closed"; return; }
    const d = Math.floor(ms / 864e5), h = Math.floor(ms / 36e5) % 24, m = Math.floor(ms / 6e4) % 60;
    $("countdown").textContent = `⏳ ${d}d ${h}h ${m}m left`;
  };
  tick(); setInterval(tick, 30000);
}

fetch("/api/shirt").then((r) => r.json()).then((s) => {
  document.title = `${s.shirt_name} Pre-Order`;
  $("brand").textContent = s.brand;
  $("name").textContent = s.shirt_name;
  $("tagline").textContent = s.tagline || "";
  $("price").textContent = `${s.currency}${s.price}`;
  chips($("sizes"), s.sizes);
  chips($("colors"), s.colors);
  $("info").innerHTML = "";
  [["Fit", s.fit], ["Material", s.material], ["Ships by", s.ships_by], ["Shipping", s.shipping]]
    .filter(([, v]) => v).forEach(([k, v]) => {
      const line = document.createElement("div");
      const b = document.createElement("b"); b.textContent = k + ": ";
      line.appendChild(b); line.appendChild(document.createTextNode(v));
      $("info").appendChild(line);
    });
  const g = $("gallery");
  (s.photos || []).forEach((p) => {
    const img = new Image();
    img.alt = s.shirt_name; img.loading = "lazy"; img.src = "/" + p;
    img.onerror = () => { const ph = document.createElement("div"); ph.className = "ph"; ph.textContent = "Add your photo: " + p; img.replaceWith(ph); };
    g.appendChild(img);
  });
  startCountdown(s.preorder_deadline);
  const f = $("footer");
  Object.entries(s.socials || {}).filter(([, url]) => url).forEach(([name, url]) => {
    const a = document.createElement("a"); a.href = url; a.target = "_blank"; a.rel = "noopener";
    a.textContent = name[0].toUpperCase() + name.slice(1); f.appendChild(a);
  });
});

switchTo("helper");
</script>
</body>
</html>
